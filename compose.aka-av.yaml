# aka-only-server と同じホストで動かすときに重ねる設定。
# aka-only-server の compose が作る共有ネットワーク（既定の名前は aka-av）に BFF だけを参加させ、
# ホスト名 aka-only-server で管理API に接続する。Valkey は参加させない。
# .env の COMPOSE_FILE=compose.yaml:compose.aka-av.yaml で有効になる。
services:
  aka-webgui:
    networks:
      - default
      - aka-av

networks:
  aka-av:
    external: true
    name: ${AKA_SHARED_NETWORK:-aka-av}
